[package]
name = "libsignal-wasm"
version = "0.1.0"
edition = "2024"
description = "Browser WASM bindings for a narrow surface of Signal's Rust libsignal protocol implementation"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
aes-gcm-siv = "0.11"
async-trait = "0.1"
futures = "0.3"
hkdf = "0.12"
js-sys = "0.3"
libsignal-account-keys = { path = "vendor/libsignal/rust/account-keys" }
libsignal-protocol = { path = "vendor/libsignal/rust/protocol" }
rand = "0.9"
rand_chacha = "0.9"
partial-default = "0.1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
signal-crypto = { path = "vendor/libsignal/rust/crypto" }
signal-media = { path = "vendor/libsignal/rust/media" }
usernames = { path = "vendor/libsignal/rust/usernames" }
uuid = "1"
wasm-bindgen = "0.2"
zkgroup = { path = "vendor/libsignal/rust/zkgroup" }
mediasan-common = "0.5.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
